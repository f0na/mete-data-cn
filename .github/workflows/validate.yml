name: Validate game data

on:
  push:
    paths:
      - "servants/**"
      - "crafts/**"
      - "mystic/**"
      - "cmdcodes/**"
      - "scripts/**"
      - "asset_sources.json"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "servants/**"
      - "crafts/**"
      - "mystic/**"
      - "cmdcodes/**"
      - "scripts/**"
      - "asset_sources.json"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test version parsing
        run: python3 scripts/version.py --self-test

      - name: Validate JSON files and source map
        run: python3 scripts/build.py --version check --check --check-sources
