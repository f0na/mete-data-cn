name: Release data package

on:
  push:
    tags:
      - "data-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # base tag lookup for patch releases

      - name: Validate release tag
        run: python3 scripts/version.py --tag "$GITHUB_REF_NAME" --check-base

      - name: Download assets
        run: python3 scripts/assets.py --jobs 32

      - name: Build data and asset packages
        run: python3 scripts/build.py --version "$GITHUB_REF_NAME" --strict-version

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/mete-data-cn.zip dist/mete-data-cn-servant.zip dist/manifest.json)
          for patch in dist/patch-*.zip; do
            if [ -e "$patch" ]; then
              assets+=("$patch")
            fi
          done
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
